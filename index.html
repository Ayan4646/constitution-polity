<html lang="en">
<head>
<meta charset="utf-8">

<title>How Does the Indian Constitution Protect Ordinary Citizens?</title>
<style>
@property --hue{syntax:'<number>';inherits:true;initial-value:28}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;touch-action:none;background:#f5f5f7}
body{--hue:28;transition:--hue 2s ease;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;color:#1d1d1f;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#fff,#f5f5f7 70%)}
.orbs{position:absolute;inset:0}
.orb{position:absolute;border-radius:50%;opacity:.75;will-change:transform}
.o1{width:62vmax;height:62vmax;left:-18vmax;top:-22vmax;background:radial-gradient(circle,hsl(var(--hue) 95% 74%),transparent 68%);animation:d1 26s ease-in-out infinite alternate}
.o2{width:56vmax;height:56vmax;right:-20vmax;top:6vmax;background:radial-gradient(circle,hsl(calc(var(--hue) + 70) 90% 76%),transparent 68%);animation:d2 30s ease-in-out infinite alternate}
.o3{width:52vmax;height:52vmax;left:14vmax;bottom:-28vmax;background:radial-gradient(circle,hsl(calc(var(--hue) + 150) 85% 74%),transparent 68%);animation:d3 34s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(14vmax,12vmax) scale(1.2)}}
@keyframes d2{to{transform:translate(-16vmax,8vmax) scale(.85)}}
@keyframes d3{to{transform:translate(10vmax,-14vmax) scale(1.15)}}
.stage{position:fixed;inset:0;perspective:1200px}
.slide{--e:1;--x:-1;--hd:0s;--cd:.7s;--sg:0s;position:absolute;inset:0;pointer-events:none;visibility:hidden}
.slide.on,.slide.out{visibility:visible}
.nt,.nt *{transition:none!important;animation:none!important}
.head{position:absolute;left:50%;top:50%;width:min(92vw,1040px);text-align:center;transform:translate(-50%,-50%);transition:top 1.8s cubic-bezier(.16,1,.3,1),transform 1.8s cubic-bezier(.16,1,.3,1);transition-delay:.3s;z-index:10}
.slide.rev .head{top:13%;transform:translate(-50%,-50%) scale(.5);transition-delay:var(--hd)}
.eb{margin-bottom:1.1rem;font-size:1.25rem;font-weight:600}
.eb .w{color:hsl(var(--hue) 75% 42%)}
h2{font-size:clamp(2.1rem,5.8vw,5rem);font-weight:700;letter-spacing:-.05em;line-height:1.04}
h2 .w{background:linear-gradient(180deg,#1d1d1f 45%,#4b4b52);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .04em}
.w{display:inline-block;opacity:0;filter:blur(16px);transform:translateY(calc(var(--e)*.9em)) rotateX(calc(var(--e)*-60deg)) scale(.85);transition:opacity 1.4s ease,filter 1.4s ease,transform 1.8s cubic-bezier(.16,1,.3,1)}
.slide.on .w{opacity:1;filter:none;transform:none;transition-delay:calc(var(--w)*.13s)}
.slide.out .w{opacity:0;filter:blur(14px);transform:translateY(calc(var(--x)*.6em)) scale(1.1);transition-delay:calc(.4s + var(--w)*.05s);transition-duration:1s,1s,1.2s}

/* ===== DYNAMIC CARD GRID ===== */
.cards{position:absolute;left:50%;top:26%;transform:translateX(-50%);width:min(94vw,1120px);display:grid;gap:18px;grid-template-columns:repeat(2,1fr)}
/* When 6 items exist, switch to 3 columns */
.cards.six-cards{grid-template-columns:repeat(3,1fr)}

/* ===== LIQUID GLASS CARD ===== */
.card{
  --dl:calc((var(--n) - 1 - var(--i))*.05s);
  position:relative;overflow:hidden;
  padding:24px 26px;
  border-radius:30px;
  background: linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.18) 45%,rgba(255,255,255,.30));
  -webkit-backdrop-filter:blur(28px) saturate(200%);
  backdrop-filter:blur(28px) saturate(200%);
  border:1px solid rgba(255,255,255,.85);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 1px rgba(255,255,255,.45), inset 0 0 40px rgba(255,255,255,.25), 0 0 0 1px rgba(0,0,0,.04), 0 22px 48px -12px rgba(60,70,120,.22), 0 8px 20px -8px hsl(var(--hue) 70% 55% / .18);
  opacity:0;transform:translateY(calc(var(--e)*70px)) scale(.55);
  transition-property:opacity,transform,scale,box-shadow;
  transition-duration:1s,1.7s,.5s,.5s;
  transition-timing-function:ease,cubic-bezier(.2,1.25,.3,1),ease,ease;
  transition-delay:var(--dl),var(--dl),0s,0s;
}

/* liquid refraction highlight */
.card::before{
  content:"";position:absolute;inset:-30% -20%;
  background: radial-gradient(60% 80% at 15% 0%,rgba(255,255,255,.9),transparent 60%), radial-gradient(50% 60% at 90% 100%,hsl(var(--hue) 90% 80% / .55),transparent 70%);
  opacity:.9;pointer-events:none;mix-blend-mode:screen;
  transform:translateX(-20%);
}
/* sheen sweep */
.card::after{
  content:"";position:absolute;inset:-40% -60%;
  background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%);
  transform:translateX(-130%);pointer-events:none;
}
.slide.on .card.show::before{animation:caustic 6s ease-in-out infinite alternate}
@keyframes caustic{
  0%{transform:translateX(-18%) scale(1)}
  100%{transform:translateX(18%) scale(1.08)}
}
.slide.on .card.show::after{animation:sheen 1.8s cubic-bezier(.4,0,.2,1) both;animation-delay:calc(var(--dl) + .5s)}
@keyframes sheen{to{transform:translateX(130%)}}

.slide.on .card.show{
  --dl:calc(var(--cd) + var(--i)*var(--sg));
  opacity:1;transform:none;pointer-events:auto;
}
.slide.out .card{
  --dl:calc((var(--n) - 1 - var(--i))*.05s);
  opacity:0;transform:translateY(calc(var(--x)*70px)) scale(1.1);
  transition-duration:.9s,1.1s,.5s,.5s;
}

/* hover glow */
.card .glow{
  position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  transition:opacity .4s;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.95),hsl(var(--hue) 90% 80% / .35) 30%,transparent 62%);
  mix-blend-mode:screen;
}
.card:hover .glow{opacity:1}
.slide.on .card.show:hover{scale:1.025}

.t{position:relative;font-size:.82rem;font-weight:600;color:hsl(var(--hue) 75% 40%);margin-bottom:.55rem;letter-spacing:.01em}
h3{position:relative;font-size:1.35rem;font-weight:650;letter-spacing:-.025em;margin-bottom:.55rem;line-height:1.2}
.card p{position:relative;font-size:.98rem;line-height:1.55;color:#4c4c54}

/* dots + hint */
.dots{position:fixed;right:max(14px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;z-index:5}
.dots i{box-sizing:content-box;width:5px;height:5px;padding:5px;background:#1d1d1f;background-clip:content-box;border-radius:10px;opacity:.22;cursor:pointer;transition:height .8s cubic-bezier(.16,1,.3,1),opacity .8s}
.dots i.a{height:22px;opacity:.9}
.hint{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom));width:24px;height:38px;margin-left:-12px;border:1.5px solid #1d1d1f;border-radius:14px;opacity:.4;transition:opacity 1s}
.hint::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:3px;background:#1d1d1f;animation:sc 1.8s ease-in-out infinite}
.hint.hide{opacity:0}
@keyframes sc{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(14px)}}

@media(max-width:900px){
  .cards,.cards.six-cards{grid-template-columns:1fr 1fr;gap:12px;top:22%}
  .card{padding:18px 18px;border-radius:24px}
  h3{font-size:1.1rem}
  .card p{font-size:.86rem}
}
@media(max-width:700px){
  .cards,.cards.six-cards{gap:10px;top:20%;width:92vw}
  .slide.rev .head{top:9.5%;transform:translate(-50%,-50%) scale(.6)}
  .card{padding:14px 15px;border-radius:20px}
  h3{font-size:.95rem;margin-bottom:.35rem}
  .card p{font-size:.74rem;line-height:1.4}
  .t{font-size:.65rem;margin-bottom:.35rem}
  .eb{font-size:1rem}
}
@media(max-width:480px){
  .cards,.cards.six-cards{grid-template-columns:1fr;top:18%;gap:9px}
  .card{padding:12px 14px}
  h3{font-size:.9rem}
  .card p{font-size:.72rem}
}
@media(prefers-reduced-motion:reduce){.orb{animation:none}.slide.on .card.show::before{animation:none}}
</style>
</head>
